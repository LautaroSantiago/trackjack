<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TrackJack</title>
<style>
  body { margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh; font-family: monospace; }
  canvas { image-rendering: pixelated; border: 4px solid #444; }
</style>
</head>
<body>
<canvas id="c" width="800" height="300"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const GROUND_Y = 240;

const player = {
  x: 80, y: GROUND_Y - 30, w: 26, h: 30,
  vy: 0, ducking: false, onGround: true,
  invulnerable: false, invulnTimer: 0
};

const GRAVITY = 1400;
const JUMP_FORCE = -560;
const INVULN_TIME = 1.4;

let obstacles = [];
let speed = 260;
let distance = 0;
let lives = 3;
let gameOver = false;
let lastTime = 0;
let spawnTimer = 0;
let dayTime = 0;
const CYCLE_LEN = 45;

let best = parseInt(localStorage.getItem('trackjack_best') || '0', 10);

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
}

const SKY_KEYS = [
  { t: 0.00, color: [92, 148, 252] },
  { t: 0.30, color: [255, 140, 66] },
  { t: 0.50, color: [18, 22, 50] },
  { t: 0.75, color: [255, 183, 140] },
  { t: 1.00, color: [92, 148, 252] }
];

function skyColor(phase) {
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    if (phase >= a.t && phase <= b.t) {
      const localT = (phase - a.t) / (b.t - a.t);
      return lerpColor(a.color, b.color, localT);
    }
  }
  return SKY_KEYS[0].color;
}

function spawnObstacle() {
  const r = Math.random();
  if (r < 0.4) {
    obstacles.push({ x: cv.width, y: GROUND_Y - 46, w: 40, h: 46, type: 'train' });
  } else if (r < 0.7) {
    obstacles.push({ x: cv.width, y: GROUND_Y - 14, w: 34, h: 14, type: 'bar' });
  } else {
    obstacles.push({ x: cv.width, y: GROUND_Y - 28, w: 24, h: 28, type: 'enemy' });
  }
}

function reset() {
  obstacles = [];
  speed = 260;
  distance = 0;
  lives = 3;
  gameOver = false;
  player.y = GROUND_Y - 30;
  player.vy = 0;
  player.ducking = false;
  player.invulnerable = false;
  player.invulnTimer = 0;
  spawnTimer = 0;
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function loseLife() {
  lives--;
  player.invulnerable = true;
  player.invulnTimer = INVULN_TIME;
  if (lives <= 0) {
    gameOver = true;
    const score = Math.floor(distance / 10);
    if (score > best) {
      best = score;
      localStorage.setItem('trackjack_best', String(best));
    }
  }
}

function update(dt) {
  dayTime = (dayTime + dt) % CYCLE_LEN;
  if (gameOver) return;

  distance += speed * dt;
  speed = 260 + distance * 0.02;

  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  if (player.y >= GROUND_Y - 30) {
    player.y = GROUND_Y - 30;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  if (player.invulnerable) {
    player.invulnTimer -= dt;
    if (player.invulnTimer <= 0) player.invulnerable = false;
  }

  player.h = player.ducking && player.onGround ? 16 : 30;
  const py = player.ducking && player.onGround ? GROUND_Y - 16 : player.y;

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = 1.1 + Math.random() * 0.9;
  }

  for (const o of obstacles) {
    o.x -= speed * dt;
    if (!player.invulnerable) {
      const playerBox = { x: player.x, y: py, w: player.w, h: player.h };
      if (aabb(playerBox, o)) loseLife();
    }
  }
  obstacles = obstacles.filter(o => o.x + o.w > 0);
}

function drawPixelSkater() {
  if (player.invulnerable && Math.floor(dayTime * 12) % 2 === 0) return;
  const y = player.ducking && player.onGround ? GROUND_Y - 16 : player.y;
  const h = player.ducking && player.onGround ? 16 : 30;
  ctx.fillStyle = '#e63946';
  ctx.fillRect(player.x, y, player.w, h - 10);
  ctx.fillStyle = '#f1c27d';
  ctx.fillRect(player.x + 6, y - 6, 14, 10);
  ctx.fillStyle = '#333';
  ctx.fillRect(player.x - 2, y + h - 6, player.w + 4, 6);
  ctx.fillStyle = '#000';
  ctx.fillRect(player.x + 2, y + h - 2, 6, 6);
  ctx.fillRect(player.x + player.w - 8, y + h - 2, 6, 6);
}

function drawEnemy(o) {
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.fillStyle = '#d62828';
  ctx.fillRect(o.x + 4, o.y + 4, 6, 6);
  ctx.fillRect(o.x + o.w - 10, o.y + 4, 6, 6);
  ctx.fillStyle = '#000';
  ctx.fillRect(o.x - 2, o.y + o.h - 4, o.w + 4, 4);
}

function draw() {
  const phase = dayTime / CYCLE_LEN;
  const sky = skyColor(phase);
  const skyCss = `rgb(${sky[0]|0},${sky[1]|0},${sky[2]|0})`;
  ctx.fillStyle = skyCss;
  ctx.fillRect(0, 0, cv.width, cv.height);

  const darkness = 1 - (sky[0] + sky[1] + sky[2]) / (255 * 3 * 1.3);
  if (darkness > 0.35) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(darkness, 0.9)})`;
    for (let i = 0; i < 18; i++) {
      const sx = (i * 137) % cv.width;
      const sy = (i * 53) % 150;
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(0, GROUND_Y, cv.width, cv.height - GROUND_Y);
  ctx.fillStyle = '#6e4423';
  const offset = Math.floor(distance) % 40;
  for (let x = -offset; x < cv.width; x += 40) {
    ctx.fillRect(x, GROUND_Y, 20, 6);
  }

  for (const o of obstacles) {
    if (o.type === 'enemy') { drawEnemy(o); continue; }
    ctx.fillStyle = o.type === 'train' ? '#264653' : '#e9c46a';
    ctx.fillRect(o.x, o.y, o.w, o.h);
  }

  drawPixelSkater();

  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('Puntos: ' + Math.floor(distance / 10), 10, 20);
  ctx.fillText('Record: ' + best, 10, 42);

  ctx.font = '20px monospace';
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#e63946' : '#555';
    ctx.fillText(i < lives ? '\u2665' : '\u2661', cv.width - 90 + i * 26, 26);
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.font = '28px monospace';
    ctx.fillText('GAME OVER', cv.width/2 - 90, cv.height/2 - 10);
    ctx.font = '16px monospace';
    ctx.fillText('Presiona ESPACIO para reiniciar', cv.width/2 - 130, cv.height/2 + 20);
  }
}

function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.033);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (gameOver) { reset(); return; }
    if (player.onGround && !player.ducking) player.vy = JUMP_FORCE;
  }
  if (e.code === 'ArrowDown') player.ducking = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowDown') player.ducking = false;
});

requestAnimationFrame(loop);
</script>
</body>
</html>
